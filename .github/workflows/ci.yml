name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "AGENTS.md", "LICENSE", "LICENSE.md", "LICENSES/**"]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          cache-on-failure: true
      - run: rustc --version
      - run: cargo metadata --locked --all-features --format-version 1 > dependency-metadata.json
      - run: python3 .github/check-first-party.py
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo check --locked --target wasm32-unknown-unknown
      - name: Install matching wasm runner
        shell: bash
        run: |
          version=$(jq -r '.packages[] | select(.name == "wasm-bindgen") | .version' dependency-metadata.json)
          archive="wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz"
          base="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}"
          mkdir -p "$RUNNER_TEMP/wasm-runner"
          cd "$RUNNER_TEMP/wasm-runner"
          curl -A 'ci-artifact-fetch/1.0' --fail --location --retry 3 --remote-name "$base/$archive"
          curl -A 'ci-artifact-fetch/1.0' --fail --location --retry 3 --remote-name "$base/$archive.sha256sum"
          checksum=$(cut -d ' ' -f1 "$archive.sha256sum")
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
          tar -xzf "$archive" --strip-components=1
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Execute the identical vectors in wasm
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --locked --target wasm32-unknown-unknown --features conformance --test contract
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: cargo-deny
      - run: cargo deny --locked check advisories
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-lock
          path: |
            Cargo.lock
            dependency-metadata.json
