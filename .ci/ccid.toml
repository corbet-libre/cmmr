schema = 1
project = "cmmr"
repository = "https://git.corbet.ch/corbet-foss/cmmr.git"

[checks.native]
kind = "commands"
commands = [["bash", "ci/native-check.sh"]]

[checks.browser]
kind = "commands"
commands = [["bash", "ci/browser-check.sh"]]

[checks.coverage]
kind = "commands"
commands = [["bash", "ci/coverage-check.sh"]]

[checks.policy]
kind = "commands"
commands = [["bash", "ci/policy-check.sh"]]

[checks.resolve]
kind = "commands"
commands = [["bash", "ci/resolve.sh"]]

[checks.acceptance-preflight]
kind = "commands"
commands = [["bash", "ci/acceptance-preflight.sh"]]

[checks.acceptance]
kind = "commands"
commands = [["bash", "ci/acceptance.sh"]]

[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["jq", "--version"], ["node", "--version"], ["python3", "--version"], ["curl", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"]]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt", "dependency-metadata.json"]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories"]]

[render]
tool_revision = "e38f347d6941aa105ac4b55a0d4b8fec2ef22433"

[jobs.verify]
scheduler = "crow"
checks = ["native", "browser", "coverage", "policy", "resolve", "verify", "advisories"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]

[push_consumer.cmsg-v01]
consumer = "https://git.corbet.ch/corbet-libs/cmsg.git"
branch = "v01"
consumer_branch = "v01"
job = "v01-push"
self_name = "cmmr"
